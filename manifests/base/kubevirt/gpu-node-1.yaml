apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: gpu-node-1
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        cpu:
          cores: 8
        memory:
          guest: 32Gi
        devices:
          autoattachGraphicsDevice: false
          logSerialConsole: true
          interfaces:
            - name: eth0
              bridge: {}
          disks:
            - name: sys-disk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          hostDevices:
            - name: nvidia-a10
              deviceName: nvidia.com/GA102GL_A10
      networks:
        - name: eth0
          multus:
            networkName: br0-network
      volumes:
        - name: sys-disk
          hostDisk:
            path: /opt/k8s-workspace/images/gpu-node-1.raw
            type: DiskOrCreate
        - name: cloudinit
          cloudInitNoCloud:
            networkData: |
              version: 2
              ethernets:
                enp1s0:
                  addresses: [192.168.1.121/24]
                  gateway4: 192.168.1.1
                  nameservers:
                    addresses: [223.5.5.5]
            userData: |
              #cloud-config
              user: leo
              password: leo
              chpasswd: { expire: False }
              ssh_pwauth: True
              runcmd:
                - netplan apply
