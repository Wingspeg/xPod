apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    shortNames:
    - net-attach-def
    singular: network-attachment-definition
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
  labels:
    app: multus
spec:
  selector:
    matchLabels:
      app: multus
  template:
    metadata:
      labels:
        app: multus
    spec:
      hostNetwork: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - operator: Exists
      containers:
      - name: multus
        image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.0.2
        args:
        - --cni-conf-dir=/host/etc/cni/net.d
        - --cni-bin-dir=/host/opt/cni/bin
        - --kubeconfig=/var/lib/kubelet/kubeconfig
        securityContext:
          privileged: true
        volumeMounts:
        - name: cni-netd
          mountPath: /host/etc/cni/net.d
        - name: cni-bin
          mountPath: /host/opt/cni/bin
        - name: kubelet-kubeconfig
          mountPath: /var/lib/kubelet/kubeconfig
      volumes:
      - name: cni-netd
        hostPath:
          path: /etc/cni/net.d
      - name: cni-bin
        hostPath:
          path: /opt/cni/bin
      - name: kubelet-kubeconfig
        hostPath:
          path: /var/lib/kubelet/kubeconfig
